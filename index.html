<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>图工坊 · 本地图片处理工具箱</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%233b82f6'/><path d='M7 8h10a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1zm1 2v2h2v-2zm3 0v2h2v-2zm3 0v2h2v-2zM7 14v1h2v-1z' fill='white'/></svg>">
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --line:#e6ecf6; --ink:#1c2a4a; --sub:#6b7fa3;
    --blue:#3b82f6; --ind:#2563eb; --cyan:#06b6d4; --soft:#f8fbff; --chip:#eef3ff;
    --danger:#ef4444; --ok:#10b981; --dropb:#c6d4ef; --rangeb:#dbe5f5;
  }
  body[data-dark="1"]{
    --bg:#0e1420; --card:#18213a; --line:#27324e; --ink:#e6ecfb; --sub:#8fa0c4;
    --soft:#121a2c; --chip:#1d2842; --dropb:#3a4770; --rangeb:#2b3856;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  .app{max-width:720px;margin:0 auto;padding:14px 14px 88px;position:relative}

  /* 顶部 */
  .top{display:flex;align-items:center;gap:11px;padding:2px 2px 12px}
  .top .tlogo{width:44px;height:44px;border-radius:13px;overflow:hidden;box-shadow:0 8px 20px rgba(59,130,246,.25);flex:none}
  .top .tlogo img{width:100%;height:100%;object-fit:cover;display:block}
  .top .tt h1{font-size:18px;font-weight:800;letter-spacing:.5px}
  .top .tt p{font-size:10.5px;color:var(--sub);margin-top:2px}

  /* 功能 tab */
  .mtabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;-ms-overflow-style:none;scrollbar-width:none}
  .mtabs::-webkit-scrollbar{display:none}
  .mtab{flex:none;display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--chip);color:var(--ind);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid transparent;white-space:nowrap}
  .mtab svg{width:15px;height:15px;fill:var(--ind)}
  .mtab.on{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;border-color:transparent}
  .mtab.on svg{fill:#fff}
  .toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 0 22px}
  .tcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:20px 8px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .12s}
  .tcard:active{transform:scale(.96)}
  .tcard svg{width:26px;height:26px;fill:none;stroke:var(--ind);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tcard b{font-size:13px;font-weight:700}
  .tcard small{font-size:10.5px;color:var(--sub)}
  .detail .docbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:flex-start;margin:-14px -14px 14px;padding:16px 14px 14px;border-radius:0 0 20px 20px;background:color-mix(in srgb,var(--bg) 74%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(31,41,55,.05)}
  .detail .docbar .docback{width:42px;height:42px;border-radius:14px;border:0;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(59,130,246,.34);transition:transform .12s}
  .detail .docbar .docback:active{transform:scale(.9)}
  .detail .docbar .docback svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .detail .doct{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;display:flex;align-items:center;font-size:16px;font-weight:700;color:var(--ink);pointer-events:none;white-space:nowrap}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 22px rgba(59,130,246,.06)}

  /* 上传空态 */
  .drop{border:2px dashed var(--dropb);border-radius:16px;padding:32px 16px;text-align:center;cursor:pointer;background:var(--soft);transition:.2s}
  .drop:hover,.drop.over{border-color:var(--blue);background:var(--chip)}
  .drop svg{width:40px;height:40px;fill:#a9bcdd}
  .drop b{display:block;font-size:14px;margin-top:10px}
  .drop p{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.7}
  .drop.add{border-style:solid;border-color:var(--blue);padding:14px;display:flex;align-items:center;justify-content:center;gap:8px}
  .drop.add b{margin:0;font-size:13px}
  input[type=file]{display:none}

  .preview{background:#0f172a;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:center;min-height:180px;overflow:hidden}
  .preview canvas,.preview img{max-width:100%;max-height:52vh;border-radius:8px;display:block;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .pinfo{position:absolute;top:10px;left:12px;font-size:10.5px;color:#cbd5e1;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:8px}

  /* 控制 tab */
  .ctabs{display:flex;gap:6px;margin:12px 0 10px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
  .ctabs::-webkit-scrollbar{display:none}
  .ctab{flex:none;display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:11px;background:var(--chip);color:var(--ind);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid transparent;white-space:nowrap}
  .ctab.on{background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;border-color:transparent}
  .cpanel{display:none}.cpanel.on{display:block}
  .grp{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;margin:12px 2px 8px}
  .grp:first-child{margin-top:2px}
  .ctl{display:flex;align-items:center;gap:10px;padding:7px 2px}
  .ctl label{font-size:12.5px;font-weight:600;min-width:62px}
  .ctl input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--rangeb);outline:none}
  .ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);cursor:pointer;border:2px solid #fff;box-shadow:0 2px 6px rgba(59,130,246,.4)}
  .ctl .val{font-size:11.5px;color:var(--sub);min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
  .ctl .r{font-size:11px;color:var(--blue);cursor:pointer;min-width:22px;text-align:right;font-weight:700;border:0;background:none;font-family:inherit}
  .ctl input[type=text],.ctl input[type=number]{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink);outline:none;font-family:inherit;min-width:0}
  .ctl input[type=text]:focus{border-color:var(--blue)}
  .cropbox{position:relative;overflow:hidden;border-radius:12px;background:rgba(0,0,0,.05);user-select:none;touch-action:none}
  .cropbox canvas{display:block;width:100%;height:auto}
  .cropwin{position:absolute;border:1.5px solid #fff;outline:1px dashed rgba(0,0,0,.45);box-shadow:0 0 0 9999px rgba(0,0,0,.4);cursor:move}
  .cropwin::after{content:"";position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#06b6d4);cursor:nwse-resize}
  .fmts{display:flex;flex-wrap:wrap;gap:8px}
  .fmts .fm{flex:1;min-width:62px}

  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .op{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid var(--line);border-radius:11px;padding:9px 3px;cursor:pointer;background:var(--soft);font-size:11.5px;font-family:inherit;color:var(--ink)}
  .op .sw{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff}
  .op.on{border-color:var(--blue);background:var(--chip);color:var(--ind);font-weight:700}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mini{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  .mini svg{width:15px;height:15px;fill:var(--ind)}
  .mini:active{background:var(--chip)}
  .mini.ghost{color:var(--danger);border-color:#f8cdd0}
  .mini.ghost svg{fill:var(--danger)}
  .fmt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .fm{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-size:12.5px;cursor:pointer;background:var(--soft);font-family:inherit;color:var(--ink)}
  .fm b{display:block}.fm small{display:block;font-size:10px;color:var(--sub);margin-top:2px;font-weight:400}
  .fm.on{border-color:var(--blue);background:var(--chip);color:var(--ind);font-weight:700}

  .statrow{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:14px;color:var(--ind)}
  .stat span{font-size:10.5px;color:var(--sub)}
  .stat.g b{color:var(--ok)}

  .thumbrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
  .thumb img{width:100%;height:64px;object-fit:cover;display:block}
  .thumb .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:0;line-height:1}
  .thumb .nm{font-size:10px;text-align:center;padding:3px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .export{display:flex;flex-direction:column;align-items:center;gap:9px;margin-top:14px}
  .dbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:auto;min-width:220px;max-width:100%;padding:13px 26px;border:0;border-radius:14px;background:linear-gradient(135deg,#3b82f6,#06b6d4);color:#fff;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 20px rgba(59,130,246,.28)}
  .dbtn svg{width:17px;height:17px;fill:#fff}
  .dbtn:active{transform:scale(.98)}
  .dbtn:disabled{opacity:.5;pointer-events:none}
  .dinfo{font-size:11px;color:var(--sub);text-align:center}

  /* 视图容器 */
  #mineView,#aboutView{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* 底部导航栏 */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  body[data-dark="1"] .nav{background:rgba(14,20,32,.9)}
  .navin{max-width:720px;margin:0 auto;display:flex}
  .nitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 calc(9px + env(safe-area-inset-bottom));font-size:10.5px;color:var(--sub);cursor:pointer;border:0;background:none;font-family:inherit}
  .nitem svg{width:21px;height:21px;fill:var(--sub)}
  .nitem.on{color:var(--ind);font-weight:700}
  .nitem.on svg{fill:url(#ngrad)}
  .nitem.on{background:linear-gradient(#3b82f6,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .nitem.on svg{-webkit-text-fill-color:initial}
  .nitem.on svg{fill:#0ea5e9}

  /* 我的 / 关于 */
  .minehero{display:flex;align-items:center;gap:13px;padding:10px 4px 16px}
  .minehero .mlogo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(59,130,246,.28);flex:none}
  .minehero .mlogo svg{width:27px;height:27px;fill:#fff}
  .minehero .mht{flex:1;min-width:0}
  .minehero .mht h2{font-size:17px;font-weight:800}
  .minehero .mht p{font-size:11px;color:var(--sub);margin-top:3px}
  .verchip{font-size:10.5px;color:var(--ind);background:var(--chip);padding:3px 11px;border-radius:99px;font-weight:700;flex:none}
  .groupt{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;margin:16px 6px 8px}
  .card.list{padding:4px 6px;margin-top:12px}
  .li{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid var(--line);cursor:pointer}
  .li:last-child{border-bottom:0}
  .li .lic{width:34px;height:34px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
  .li .lic svg{width:18px;height:18px;fill:var(--ind)}
  .li .lit{flex:1;min-width:0}
  .li .lit b{display:block;font-size:13.5px;font-weight:700}
  .li .lit small{display:block;font-size:10.5px;color:var(--sub);margin-top:2px}
  .li .liar{color:var(--sub);font-size:17px;font-weight:600}
  .switch{width:42px;height:24px;border-radius:99px;background:#d7e0f0;position:relative;transition:.2s;flex:none;cursor:pointer}
  body[data-dark="1"] .switch{background:#3a4770}
  .switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
  .switch.on{background:linear-gradient(135deg,#3b82f6,#06b6d4)}
  .switch.on i{left:20px}
  .foot{text-align:center;font-size:10.5px;color:var(--sub);margin:20px 0 6px;line-height:1.8}

  /* 文档独立页 */
  .docpage{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;flex-direction:column;animation:fade .22s ease}
  .docbar{display:flex;align-items:center;gap:10px;padding:14px 14px calc(12px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);flex:none}
  .docbar .docback{width:34px;height:34px;border-radius:10px;background:var(--chip);color:var(--ind);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;border:0;font-family:inherit}
  .docbar b{font-size:16px;font-weight:800;flex:1}
  .docbody{flex:1;overflow-y:auto;padding:18px 18px 30px;line-height:1.8;font-size:13px}
  .docbody h4{font-size:13.5px;color:var(--ind);margin:16px 0 6px;font-weight:800}
  .docbody h4:first-child{margin-top:0}
  .docbody p{color:var(--ink);margin:4px 0}
  .docbody .doclead{color:var(--sub);font-size:12px;margin-bottom:6px}
  .docbody b.term{font-weight:700;color:var(--ink)}
  .docpage.show{display:flex}

  /* 退出确认弹窗 */
  .exitmask{position:fixed;inset:0;z-index:120;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:0 28px;animation:fade .2s ease}
  .exitmask.show{display:flex}
  .exitdlg{width:100%;max-width:340px;background:var(--card);border-radius:20px;padding:26px 20px 18px;text-align:center;box-shadow:0 18px 50px rgba(15,23,42,.25);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
  .exitdlg .exitico{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 10px 22px rgba(59,130,246,.3)}
  .exitdlg .exitico svg{width:30px;height:30px;fill:#fff}
  .exitdlg h3{font-size:17px;font-weight:800;margin-bottom:6px}
  .exitdlg p{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:18px}
  .exitbtns{display:flex;gap:10px}
  .exitbtns button{flex:1;height:42px;border-radius:12px;border:0;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .exitbtns .eb-no{background:var(--chip);color:var(--ind)}
  .exitbtns .eb-yes{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff}
  @keyframes pop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}

  .abhead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 10px 6px}
  .abhead .ablogo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(59,130,246,.3)}
  .abhead .ablogo svg{width:34px;height:34px;fill:#fff}
  .abhead h2{font-size:17px;font-weight:800;margin-top:12px}
  .abhead p{font-size:11.5px;color:var(--sub);margin-top:5px;max-width:280px;line-height:1.7}
  .abhead .ver{font-size:10.5px;color:var(--ind);background:var(--chip);padding:3px 12px;border-radius:99px;margin-top:10px;font-weight:700}

  .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(28,42,74,.95);color:#fff;padding:12px 22px;border-radius:14px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="tlogo"><img src="appIcon.png" alt="图工坊"></div>
    <div class="tt"><h1 id="mtitle">图工坊</h1><p id="msub">全部本地处理 · 图片绝不上传 · 即开即用</p></div>
  </div>

  <div id="toolView">
    <div class="toolgrid" id="toolGrid"></div>
    <div class="detail" id="toolDetail" style="display:none">
      <div class="docbar"><button class="docback" id="toolBack" onclick="closeTool()"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></button><span class="doct" id="toolDT">工具</span></div>
      <div id="stage"></div>
    </div>
  </div>

  <div id="mineView" style="display:none">
    <div class="card list">
      <div class="li">
        <div class="lic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-7.54-7.54A9 9 0 0 0 12 3zm0-2a11 11 0 1 1-9.9 5.6A11 11 0 0 1 12 1zM8 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm8 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg></div>
        <div class="lit"><b>深色模式</b><small>夜间护眼，自动记忆</small></div>
        <div class="switch" id="dkSw" onclick="toggleDark()"><i></i></div>
      </div>
      <div class="li" onclick="clearCache()">
        <div class="lic"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm3 3h10v12a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9zm3 2v7h2v-7zm4 0v7h2v-7zM9 4h6l1-2H8l1 2z"/></svg></div>
        <div class="lit"><b>清除缓存</b><small>清空已载入的图片数据</small></div>
        <div class="liar">›</div>
      </div>
      <div class="li" onclick="checkUpd()">
        <div class="lic"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66l1.41 1.41A10 10 0 1 1 22 12h-2zm1.4 2.4-4.2-4.2-1.4 1.4 4.2 4.2z"/></svg></div>
        <div class="lit"><b>检查更新</b><small>当前 v1.0.0</small></div>
        <div class="liar">›</div>
      </div>
    </div>
    <div class="groupt">关于</div>
    <div class="card list">
      <div class="li" onclick="showDoc('关于')">
        <div class="lic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v6h-2V7h2zm0 8v2h-2v-2h2z"/></svg></div>
        <div class="lit"><b>关于本应用</b><small>图工坊 · 本地图片处理工具箱</small></div>
        <div class="liar">›</div>
      </div>

function mePanel(k,html){return '<div class="cpanel'+(k==="adj"?" on":"")+'" id="me-cp-'+k+'">'+html+'</div>';}
me.bindEvents=function(){
  ["bri","con","sat"].forEach(id=>{const r=$("me-"+id);r.oninput=()=>{const v=+r.value;$("me-"+id+"v").textContent=v;$("me-"+id+"r").style.visibility=v?"visible":"hidden";if(id==="bri")me.bright=v;if(id==="con")me.contrast=v;if(id==="sat")me.sat=v;renderMe();};$("me-"+id+"r").onclick=()=>{r.value=0;r.oninput();};});
  document.querySelectorAll("#me-filters .op").forEach(o=>o.onclick=()=>{setMeFilter(o.dataset.f);});
  $("me-rotL").onclick=()=>{me.rot=(me.rot+270)%360;renderMe();};
  $("me-rotR").onclick=()=>{me.rot=(me.rot+90)%360;renderMe();};
  $("me-flipH").onclick=()=>{me.flipH=!me.flipH;renderMe();};
  $("me-flipV").onclick=()=>{me.flipV=!me.flipV;renderMe();};
  $("me-resetT").onclick=()=>{me.rot=0;me.flipH=me.flipV=false;renderMe();};
  document.querySelectorAll("#me-crops .op").forEach(o=>o.onclick=()=>applyMeRatio(+o.dataset.c));
  ["crpT","crpB","crpL","crpR"].forEach(id=>{const r=$("me-"+id);r.oninput=()=>{const side={crpT:"t",crpB:"b",crpL:"l",crpR:"r"}[id];setMeCrop(side,+r.value);};});
  $("me-cropRes").onclick=()=>{me.cropL=me.cropR=me.cropT=me.cropB=0;me.ratio=0;syncMeCropUI();document.querySelectorAll("#me-crops .op").forEach((o,i)=>o.classList.toggle("on",i===0));renderMe();};
  const os=$("me-oScale");os.oninput=()=>setMeScale(+os.value/100);
  $("me-oScaler").onclick=()=>{os.value=100;os.oninput();};
  document.querySelectorAll("#me-fmts .fm").forEach(f=>f.onclick=()=>{document.querySelectorAll("#me-fmts .fm").forEach(x=>x.classList.remove("on"));f.classList.add("on");me.fmt=f.dataset.f;$("me-qwrap").style.display=me.fmt==="png"?"none":"flex";renderMe();});
  const q=$("me-q");q.oninput=()=>{me.qty=+q.value/100;$("me-qv").textContent=q.value+"%";renderMe();};

me.fmt="png";me.qty=0.9;
const ME_RATIOS=[[0,0],[1,1],[4,3],[16,9],[3,4],[9,16],[2,1],[1,2]];
function syncMeCropUI(){const map={crpT:me.cropT,crpB:me.cropB,crpL:me.cropL,crpR:me.cropR};["crpT","crpB","crpL","crpR"].forEach(id=>{const v=Math.round(map[id]*100);$("me-"+id).value=v;$("me-"+id+"v").textContent=v+"%";});}
function setMeCrop(side,p){const v=p/100;if(side==="t")me.cropT=v;else if(side==="b")me.cropB=v;else if(side==="l")me.cropL=v;else if(side==="r")me.cropR=v;me.ratio=0;document.querySelectorAll("#me-crops .op").forEach((o,i)=>o.classList.toggle("on",i===0));syncMeCropUI();renderMe();}
function applyMeRatio(mode){me.ratio=mode;document.querySelectorAll("#me-crops .op").forEach((o,i)=>o.classList.toggle("on",i===mode));if(mode===0){me.cropT=me.cropB=me.cropL=me.cropR=0;syncMeCropUI();renderMe();return;}const[rw,rh]=ME_RATIOS[mode];const w=me.img.width,h=me.img.height;let cT=0,cB=0,cL=0,cR=0;if(rw/rh>w/h){const th=w*rh/rw;cT=cB=Math.max(0,(h-th)/2/h);}else{const tw=h*rw/rh;cL=cR=Math.max(0,(w-tw)/2/w);}me.cropT=cT;me.cropB=cB;me.cropL=cL;me.cropR=cR;syncMeCropUI();renderMe();}
function setMeFilter(f){if(f==="reset")f="none";me.filter=f;document.querySelectorAll("#me-filters .op").forEach(x=>{const on=f==="none"?(x.dataset.f==="none"&&!x.classList.contains("rst")):x.dataset.f===f;x.classList.toggle("on",on);});renderMe();}
function setMeScale(s){me.scale=s;const p=Math.round(s*100);$("me-oScale").value=p;$("me-oScalev").textContent=p+"%";$("me-oScaler").style.visibility=s<1?"visible":"hidden";renderMe();}
function resetMe(){me.cropL=me.cropR=me.cropT=me.cropB=0;me.rot=0;me.flipH=me.flipV=false;me.bright=me.contrast=me.sat=0;me.filter="none";me.scale=1;me.ratio=0;me.fmt="png";me.qty=0.9;["bri","con","sat"].forEach(id=>{const r=$("me-"+id);if(r){r.value=0;$("me-"+id+"v").textContent="0";$("me-"+id+"r").style.visibility="hidden";}});}
function drawMeTo(canvas,outScale){
  const sw=Math.max(1,me.img.width*(1-me.cropL-me.cropR)),sh=Math.max(1,me.img.height*(1-me.cropT-me.cropB));
  const ci=document.createElement("canvas");ci.width=Math.round(sw);ci.height=Math.round(sh);
  ci.getContext("2d").drawImage(me.img,me.img.width*me.cropL,me.img.height*me.cropT,sw,sh,0,0,Math.round(sw),Math.round(sh));
  let w=ci.width,h=ci.height;if(me.rot%180)[w,h]=[h,w];
  w=Math.max(1,Math.round(w*outScale));h=Math.max(1,Math.round(h*outScale));
  canvas.width=w;canvas.height=h;const c=canvas.getContext("2d");
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality="high";
  const fl="brightness("+(100+me.bright)+"%) contrast("+(100+me.contrast)+"%) saturate("+(100+me.sat)+"%) "+(me.filter==="gray"?"grayscale(1) ":me.filter==="sepia"?"sepia(.9) ":me.filter==="warm"?"sepia(.5) saturate(1.5) ":me.filter==="cool"?"hue-rotate(170deg) saturate(.9) ":me.filter==="invert"?"invert(1) ":me.filter==="blur"?"blur(2px) ":"");
  c.filter=fl;c.save();c.translate(w/2,h/2);c.rotate(me.rot*Math.PI/180);c.scale(me.flipH?-1:1,me.flipV?-1:1);
  c.drawImage(ci,-ci.width*outScale/2,-ci.height*outScale/2,ci.width*outScale,ci.height*outScale);c.restore();c.filter="none";
}
function renderMe(){
  if(!me.img)return;const cv=meCanvas();
  let out=1;const bw=me.img.width*(1-me.cropL-me.cropR),bh=me.img.height*(1-me.cropT-me.cropB);let w=bw,h=bh;if(me.rot%180)[w,h]=[h,w];const mx=Math.max(w,h);if(mx>1100)out=1100/mx;
  drawMeTo(cv,out);
  const ew=Math.round((me.rot%180?bh:bw)*me.scale),eh=Math.round((me.rot%180?bw:bh)*me.scale);
  $("me-pinfo").textContent=me.img.width+"×"+me.img.height+" → "+ew+"×"+eh;
  $("me-dinfo").textContent="导出 "+ew+"×"+eh+"px · "+me.fmt.toUpperCase()+(me.fmt==="png"?"（无损）":" 质量 "+Math.round(me.qty*100)+"%");
}
function exportMe(){
  if(!me.img)return;const t=document.createElement("canvas");drawMeTo(t,me.scale);
  const mime={png:"image/png",jpeg:"image/jpeg",webp:"image/webp"}[me.fmt];
  t.toBlob(b=>{if(!b){toast("导出失败");return;}const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="edit_"+Date.now()+"."+(me.fmt==="jpeg"?"jpg":me.fmt);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast("已开始下载");},mime,me.fmt==="png"?undefined:me.qty);
}

/* ============================================================
   功能二：图片压缩
============================================================ */
function modCompress(){
  return '<div id="mc-wrap"></div>';
}
const mc={img:null,file:null,blob:null,fmt:"jpeg",req:0};
function loadMc(file){if(!file||!file.type.startsWith("image/")){toast("请选择图片");return;}loadImage(file,im=>{mc.img=im;mc.file=file;$("mc-panel").style.display="block";mcCompute();});}
/* 压缩计算：预览用小图实时，体积用全尺寸 toBlob（带请求序号防串台） */
function mcCompute(){
  if(!mc.img)return;
  const id=++mc.req;
  const q=+$("mc-q").value/100,s=+$("mc-s").value/100;
  $("mc-qv").textContent=Math.round(q*100)+"%";$("mc-sv").textContent=Math.round(s*100)+"%";
  /* 预览（限制最长边约 900，拖动时即时反馈） */
  const cv=$("mc-cv");let pw=mc.img.width,ph=mc.img.height,ps=1;
  const mx=Math.max(pw,ph);if(mx>900)ps=900/mx;
  cv.width=Math.max(1,Math.round(pw*ps));cv.height=Math.max(1,Math.round(ph*ps));
  cv.getContext("2d").drawImage(mc.img,0,0,cv.width,cv.height);
  /* 体积计算（全尺寸，异步） */
  $("mc-nb").textContent="计算中…";$("mc-rate").textContent="…";
  const t=document.createElement("canvas");
  t.width=Math.max(1,Math.round(mc.img.width*s));t.height=Math.max(1,Math.round(mc.img.height*s));
  t.getContext("2d").drawImage(mc.img,0,0,t.width,t.height);
  const mime={jpeg:"image/jpeg",webp:"image/webp",png:"image/png"}[mc.fmt];
  t.toBlob(b=>{
    if(id!==mc.req)return;                 /* 已被更新的请求取代，丢弃旧结果 */
    mc.blob=b;
    if(!b){$("mc-nb").textContent="失败";return;}
    const ob=mc.file.size,nb=b.size;
    $("mc-ob").textContent=fmtSize(ob);$("mc-nb").textContent=fmtSize(nb);
    $("mc-rate").textContent=Math.max(0,Math.round((1-nb/ob)*100))+"%";
  },mime,mc.fmt==="png"?undefined:q);
}
modCompress.init=function(){

    '<div class="card" id="mc-panel" style="display:none;margin-top:12px">'+
      '<div class="preview"><canvas id="mc-cv"></canvas></div>'+
      '<div class="grp">输出格式</div>'+
      '<div class="fmt" id="mc-fmts">'+
        '<div class="fm on" data-f="jpeg"><b>JPEG</b><small>有损，压缩效果好</small></div>'+
        '<div class="fm" data-f="webp"><b>WebP</b><small>体积最小</small></div>'+
        '<div class="fm" data-f="png"><b>PNG</b><small>无损，倍率无效</small></div>'+
      '</div>'+
      '<div class="grp" id="mc-qgrp">压缩质量（越高体积越大）</div>'+
      '<div class="ctl"><input type="range" id="mc-q" min="10" max="100" value="60"><span class="val" id="mc-qv">60%</span></div>'+
      '<div class="ctl"><label>尺寸</label><input type="range" id="mc-s" min="10" max="100" value="100"><span class="val" id="mc-sv">100%</span></div>'+
      '<div class="statrow"><div class="stat"><b id="mc-ob">—</b><span>原始大小</span></div><div class="stat g"><b id="mc-nb">—</b><span>压缩后</span></div><div class="stat"><b id="mc-rate">—</b><span>压缩率</span></div></div>'+
      '<div class="export"><button class="dbtn" id="mc-dbtn">'+svgI('<path d="M12 16V3m0 13 4-4m-4 4-4-4M4 21h16"/>')+'下载压缩图</button></div>'+
    '</div>';

function readExif(file){return new Promise(res=>{if(!file||file.type!=="image/jpeg"){res('<span>该格式不包含标准 EXIF 元数据（PNG/WebP 无 EXIF）。</span>');return;}const rd=new FileReader();rd.onload=()=>{res(parseExif(rd.result)||'<span>未检测到 EXIF 元数据。</span>');};rd.onerror=()=>res('<span>读取失败。</span>');rd.readAsArrayBuffer(file);});}
function parseExif(buf){const dv=new DataView(buf);if(dv.byteLength<4||dv.getUint16(0)!==0xffd8)return null;let off=2;while(off<dv.byteLength-3){if(dv.getUint8(off)!==0xff){off++;continue;}const mk=dv.getUint8(off+1);if(mk===0xd8||mk===0xd9||(mk>=0xd0&&mk<=0xd7)){off+=2;continue;}if(mk===0xda)break;const len=dv.getUint16(off+2);if(mk===0xe1){const ex=parseApp1(dv,off+4,len-2);if(ex)return ex;}off+=2+len;}return null;}
function parseApp1(dv,st,len){if(dv.byteLength<st+10||dv.getUint32(st)!==0x45786966)return null;const tiff=st+6,le=dv.getUint8(tiff)===0x49;const u16=o=>le?dv.getUint16(o,true):dv.getUint16(o);const u32=o=>le?dv.getUint32(o,true):dv.getUint32(o);if(dv.byteLength<tiff+8||u16(tiff)!==0x2a)return null;const ifd0=tiff+u32(tiff+4),n=u16(ifd0),out=[],names={0x010F:"厂商",0x0110:"型号",0x0132:"拍摄时间"};for(let i=0;i<n;i++){const e=ifd0+2+i*12,tag=u16(e);if(names[tag]===undefined)continue;const type=u16(e+2),cnt=u32(e+4);let val="";if(type===2&&cnt>0){const p=u32(e+8);for(let k=0;k<cnt-1&&p+k<len;k++){const ch=dv.getUint8(tiff+p+k);if(ch===0)break;val+=String.fromCharCode(ch);}}else if(type===3){val=String(u16(e+8));}else if(type===4){val=String(u32(e+8));}out.push('<span><b style="color:var(--ind)">'+names[tag]+'</b>：'+val+'</span>');}return out.length?'<p style="margin:3px 0">'+out.join('</p><p style="margin:3px 0">')+'</p>':null;}

/* ===== 功能十四：图片裁剪 ===== */
const crop={img:null};let cropRat=0;
function modCrop(){return '<div id="mcrop-wrap"></div>';}
function cropFit(){const b=$("mcrop-box").getBoundingClientRect(),w0=Math.max(60,b.width*0.62),h0=w0/(cropRat||1);let w=w0,h=h0;if(h>b.height*0.72){h=b.height*0.72;w=h*(cropRat||1);}const s=$("mcrop-win").style;s.left=Math.max(0,(b.width-w)/2)+"px";s.top=Math.max(0,(b.height-h)/2)+"px";s.width=w+"px";s.height=h+"px";}
function cropRect(){const b=$("mcrop-box").getBoundingClientRect(),r=$("mcrop-win").getBoundingClientRect();return{x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height,bw:b.width,bh:b.height};}
function loadCrop(file){if(!file||!file.type.startsWith("image/")){toast("请选择图片");return;}loadImage(file,im=>{crop.img=im;$("mcrop-panel").style.display="block";const cv=$("mcrop-cv");cv.width=im.width;cv.height=im.height;cv.getContext("2d").drawImage(im,0,0);cropFit();});}
modCrop.init=function(){
  $("mcrop-wrap").innerHTML='<div class="drop" id="mcrop-drop"><svg viewBox="0 0 24 24"><path d="M12 16l4-4h-3V3h-2v9H8zM4 20h16v-6h-2v4H6v-4H4z"/></svg><b>选择或拖拽图片</b><p>拖拽调整裁剪框 · 支持自由或按比例裁切</p></div>'+
    '<div class="card" id="mcrop-panel" style="display:none;margin-top:12px"><div class="cropbox" id="mcrop-box"><canvas id="mcrop-cv"></canvas><div class="cropwin" id="mcrop-win"></div></div>'+
    '<div class="ctl"><label>比例</label><div class="fmts" id="mcrop-rats"><div class="fm on" data-r="0"><b>自由</b></div><div class="fm" data-r="1"><b>1:1</b></div><div class="fm" data-r="4.3"><b>4:3</b></div><div class="fm" data-r="16.9"><b>16:9</b></div></div></div>'+
    '<div class="export"><button class="dbtn" id="mcrop-dbtn">'+svgI('<path d="M12 16V3m0 13 4-4m-4 4-4-4M4 21h16"/>')+'应用裁剪并下载</button></div></div>';
  bindDrop($("mcrop-drop"),"image/*",loadCrop);
  document.querySelectorAll("#mcrop-rats .fm").forEach(f=>f.onclick=()=>{document.querySelectorAll("#mcrop-rats .fm").forEach(x=>x.classList.remove("on"));f.classList.add("on");cropRat=+f.dataset.r;cropFit();});
  let drag=null;
  $("mcrop-win").addEventListener("pointerdown",e=>{e.preventDefault();const r=cropRect(),sx=e.clientX,sy=e.clientY;drag={mode:(Math.abs(sx-(r.x+r.w))<12&&Math.abs(sy-(r.y+r.h))<12)?"se":"move",sx,sy,ox:r.x,oy:r.y,ow:r.w,oh:r.h};});
  document.addEventListener("pointermove",e=>{if(!drag)return;const{ox,oy,ow,oh,mode,sx,sy}=drag,dx=e.clientX-sx,dy=e.clientY-sy,b=cropRect();if(mode==="move"){let x=Math.min(Math.max(ox+dx,0),b.bw-ow),y=Math.min(Math.max(oy+dy,0),b.bh-oh);const s=$("mcrop-win").style;s.left=x+"px";s.top=y+"px";s.width=ow+"px";s.height=oh+"px";}else{let w=Math.min(Math.max(ow+dx,40),b.bw-ox),h=Math.min(Math.max(oh+dy,40),b.bh-oy);if(cropRat){if(w/h>cropRat)w=h*cropRat;else h=w/cropRat;}const s=$("mcrop-win").style;s.left=ox+"px";s.top=oy+"px";s.width=w+"px";s.height=h+"px";}});
  document.addEventListener("pointerup",()=>{drag=null;});
  $("mcrop-dbtn").onclick=()=>{if(!crop.img){toast("请先选择图片");return;}const{x,y,w,h,bw,bh}=cropRect(),sx=crop.img.width/bw,sy=crop.img.height/bh,t=document.createElement("canvas");t.width=Math.max(1,Math.round(w*sx));t.height=Math.max(1,Math.round(h*sy));t.getContext("2d").drawImage(crop.img,-x*sx,-y*sy);t.toBlob(b=>{if(!b){toast("导出失败");return;}downloadBlob(b,"crop_"+Date.now()+".png");},"image/png");};
};

/* ===== 功能十五：图片缩放 ===== */
const mrsz={img:null,w:0,h:0,ow:0,oh:0,ratio:1};
function modResize(){return '<div id="mrsz-wrap"></div>';}
function renderRsz(){if(!mrsz.img)return;const cv=$("mrsz-cv");cv.width=mrsz.w;cv.height=mrsz.h;cv.getContext("2d").drawImage(mrsz.img,0,0,mrsz.w,mrsz.h);}
function loadRsz(file){if(!file||!file.type.startsWith("image/")){toast("请选择图片");return;}loadImage(file,im=>{mrsz.img=im;mrsz.ow=im.width;mrsz.oh=im.height;mrsz.ratio=im.height/im.width;mrsz.w=im.width;mrsz.h=im.height;$("mrsz-w").value=mrsz.w;$("mrsz-h").value=mrsz.h;$("mrsz-p").value=100;$("mrsz-pv").textContent="100%";$("mrsz-panel").style.display="block";renderRsz();});}
modResize.init=function(){
  $("mrsz-wrap").innerHTML='<div class="drop" id="mrsz-drop"><svg viewBox="0 0 24 24"><path d="M12 16l4-4h-3V3h-2v9H8zM4 20h16v-6h-2v4H6v-4H4z"/></svg><b>选择或拖拽图片</b><p>精确调整图片尺寸 · 保持原图比例</p></div>'+
    '<div class="card" id="mrsz-panel" style="display:none;margin-top:12px"><div class="preview"><canvas id="mrsz-cv"></canvas></div>'+
    '<div class="ctl"><label>宽度</label><input type="number" id="mrsz-w" class="num" min="1"><span>px</span></div>'+
    '<div class="ctl"><label>高度</label><input type="number" id="mrsz-h" class="num" min="1"><span>px</span></div>'+
    '<div class="ctl"><label>缩放</label><input type="range" id="mrsz-p" min="10" max="300" value="100"><span class="val" id="mrsz-pv">100%</span></div>'+
    '<div class="export"><button class="dbtn" id="mrsz-dbtn">'+svgI('<path d="M12 16V3m0 13 4-4m-4 4-4-4M4 21h16"/>')+'下载缩放图</button></div></div>';
  bindDrop($("mrsz-drop"),"image/*",loadRsz);
  $("mrsz-w").oninput=()=>{mrsz.w=Math.max(1,+$("mrsz-w").value||1);mrsz.h=Math.round(mrsz.w*mrsz.ratio);$("mrsz-h").value=mrsz.h;$("mrsz-p").value=Math.round(mrsz.w/mrsz.ow*100);$("mrsz-pv").textContent=$("mrsz-p").value+"%";renderRsz();};
  $("mrsz-h").oninput=()=>{mrsz.h=Math.max(1,+$("mrsz-h").value||1);mrsz.w=Math.round(mrsz.h/mrsz.ratio);$("mrsz-w").value=mrsz.w;$("mrsz-p").value=Math.round(mrsz.w/mrsz.ow*100);$("mrsz-pv").textContent=$("mrsz-p").value+"%";renderRsz();};
  $("mrsz-p").oninput=()=>{const p=+$("mrsz-p").value;$("mrsz-pv").textContent=p+"%";mrsz.w=Math.max(1,Math.round(mrsz.ow*p/100));mrsz.h=Math.round(mrsz.w*mrsz.ratio);$("mrsz-w").value=mrsz.w;$("mrsz-h").value=mrsz.h;renderRsz();};
  $("mrsz-dbtn").onclick=()=>{if(!mrsz.img){toast("请先选择图片");return;}const t=document.createElement("canvas");t.width=mrsz.w;t.height=mrsz.h;t.getContext("2d").drawImage(mrsz.img,0,0,t.width,t.height);t.toBlob(b=>{if(!b){toast("导出失败");return;}downloadBlob(b,"resized_"+Date.now()+".png");},"image/png");};
};

/* ===== 功能十六：艺术滤镜 ===== */
const mart={img:null,fx:"gray"};
function modArt(){return '<div id="mart-wrap"></div>';}
function applyArt(cv){const c=cv.getContext("2d"),d=c.getImageData(0,0,cv.width,cv.height),p=d.data;if(mart.fx==="pixel"){const sz=Math.max(3,Math.round(Math.max(cv.width,cv.height)/40));for(let y=0;y<cv.height;y+=sz)for(let x=0;x<cv.width;x+=sz){const i=(y*cv.width+x)*4;c.fillStyle="rgb("+p[i]+","+p[i+1]+","+p[i+2]+")";c.fillRect(x,y,sz,sz);}return;}for(let i=0;i<p.length;i+=4){const r=p[i],g=p[i+1],b=p[i+2];if(mart.fx==="gray"){const v=(r*0.3+g*0.59+b*0.11)|0;p[i]=p[i+1]=p[i+2]=v;}else if(mart.fx==="neg"){p[i]=255-r;p[i+1]=255-g;p[i+2]=255-b;}else if(mart.fx==="sepia"){p[i]=Math.min(255,(r*0.393+g*0.769+b*0.189)|0);p[i+1]=Math.min(255,(r*0.349+g*0.686+b*0.168)|0);p[i+2]=Math.min(255,(r*0.272+g*0.534+b*0.131)|0);}else if(mart.fx==="sketch"){const v=(r*0.3+g*0.59+b*0.11)|0,o=v>128?255:0;p[i]=p[i+1]=p[i+2]=o;}}c.putImageData(d,0,0);}
function renderArt(){if(!mart.img)return;const cv=$("mart-cv");cv.width=mart.img.width;cv.height=mart.img.height;const c=cv.getContext("2d");c.drawImage(mart.img,0,0);applyArt(cv);}
function loadArt(file){if(!file||!file.type.startsWith("image/")){toast("请选择图片");return;}loadImage(file,im=>{mart.img=im;$("mart-panel").style.display="block";renderArt();});}
modArt.init=function(){
  $("mart-wrap").innerHTML='<div class="drop" id="mart-drop"><svg viewBox="0 0 24 24"><path d="M12 16l4-4h-3V3h-2v9H8zM4 20h16v-6h-2v4H6v-4H4z"/></svg><b>选择或拖拽图片</b><p>一键应用黑白、负片、复古、素描、像素化效果</p></div>'+
    '<div class="card" id="mart-panel" style="display:none;margin-top:12px"><div class="preview"><canvas id="mart-cv"></canvas></div>'+
    '<div class="ctl"><label>效果</label><div class="fmts" id="mart-fx"><div class="fm on" data-f="gray"><b>黑白</b></div><div class="fm" data-f="neg"><b>负片</b></div><div class="fm" data-f="sepia"><b>复古</b></div><div class="fm" data-f="sketch"><b>素描</b></div><div class="fm" data-f="pixel"><b>像素化</b></div></div></div>'+
    '<div class="export"><button class="dbtn" id="mart-dbtn">'+svgI('<path d="M12 16V3m0 13 4-4m-4 4-4-4M4 21h16"/>')+'下载图片</button></div></div>';
  bindDrop($("mart-drop"),"image/*",loadArt);
  document.querySelectorAll("#mart-fx .fm").forEach(f=>f.onclick=()=>{document.querySelectorAll("#mart-fx .fm").forEach(x=>x.classList.remove("on"));f.classList.add("on");mart.fx=f.dataset.f;renderArt();});
  $("mart-dbtn").onclick=()=>{if(!mart.img){toast("请先选择图片");return;}const t=document.createElement("canvas");t.width=mart.img.width;t.height=mart.img.height;t.getContext("2d").drawImage(mart.img,0,0);applyArt(t);t.toBlob(b=>{if(!b){toast("导出失败");return;}downloadBlob(b,"art_"+Date.now()+".png");},"image/png");};
};

/* ===== 功能十七：去背景 ===== */
const mbgr={img:null,tol:40};
function modBgrm(){return '<div id="mbgr-wrap"></div>';}
function removeBg(cv,tol){const c=cv.getContext("2d"),d=c.getImageData(0,0,cv.width,cv.height),p=d.data;for(let i=0;i<p.length;i+=4){if(p[i]>255-tol&&p[i+1]>255-tol&&p[i+2]>255-tol)p[i+3]=0;}c.putImageData(d,0,0);}
function renderBgr(){if(!mbgr.img)return;const cv=$("mbgr-cv");cv.width=mbgr.img.width;cv.height=mbgr.img.height;const c=cv.getContext("2d");c.drawImage(mbgr.img,0,0);removeBg(cv,mbgr.tol);}
function loadBgr(file){if(!file||!file.type.startsWith("image/")){toast("请选择图片");return;}loadImage(file,im=>{mbgr.img=im;$("mbgr-panel").style.display="block";renderBgr();});}
modBgrm.init=function(){
  $("mbgr-wrap").innerHTML='<div class="drop" id="mbgr-drop"><svg viewBox="0 0 24 24"><path d="M12 16l4-4h-3V3h-2v9H8zM4 20h16v-6h-2v4H6v-4H4z"/></svg><b>选择或拖拽图片</b><p>一键去除纯色背景（默认白色），生成透明 PNG</p></div>'+
    '<div class="card" id="mbgr-panel" style="display:none;margin-top:12px"><div class="preview"><canvas id="mbgr-cv"></canvas></div>'+
    '<div class="ctl"><label>容差</label><input type="range" id="mbgr-tol" min="0" max="160" value="40"><span class="val" id="mbgr-tolv">40</span></div>'+
    '<div class="export"><button class="dbtn" id="mbgr-dbtn">'+svgI('<path d="M12 16V3m0 13 4-4m-4 4-4-4M4 21h16"/>')+'下载透明 PNG</button></div></div>';
  bindDrop($("mbgr-drop"),"image/*",loadBgr);
  $("mbgr-tol").oninput=()=>{mbgr.tol=+$("mbgr-tol").value;$("mbgr-tolv").textContent=mbgr.tol;renderBgr();};
  $("mbgr-dbtn").onclick=()=>{if(!mbgr.img){toast("请先选择图片");return;}const t=document.createElement("canvas");t.width=mbgr.img.width;t.height=mbgr.img.height;t.getContext("2d").drawImage(mbgr.img,0,0);removeBg(t,mbgr.tol);t.toBlob(b=>{if(!b){toast("导出失败");return;}downloadBlob(b,"bgremoved_"+Date.now()+".png");},"image/png");};
};

renderMods();
</script>
